<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scoreboard Widget</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #scoreboard {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Generic control bar — same visual language as the other widgets',
     deliberately not part of any template so it looks consistent no
     matter which layout you pick. Crop it out in OBS/vMix if you don't
     want it visible on stream. */
  .score-controls {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 10px;
    border-radius: 999px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .ctrl-cluster {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px;
  }
  .score-ctrl-label {
    font-family: -apple-system, 'Segoe UI', sans-serif;
    font-size: 11px;
    color: #cfcfcf;
    max-width: 90px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ctrl-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .ctrl-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.25); }
  .ctrl-btn:disabled { opacity: 0.35; cursor: default; }
  .ctrl-score-plus { color: #3BD16F; }
  .ctrl-score-minus { color: #FF4438; }
  .ctrl-score-reset, .ctrl-reset, .ctrl-size-reset { color: #E8E6E1; font-size: 14px; }
  .ctrl-size-down, .ctrl-size-up { color: #4CC9F0; font-size: 16px; font-weight: 700; }
  .ctrl-play { color: #3BD16F; }
  .ctrl-pause { color: #FFB020; }
  .ctrl-stoppage { color: #FF9E5C; font-size: 11px; font-weight: 700; width: auto; padding: 0 8px; border-radius: 14px; }
  .ctrl-added-time { color: #777; }
  .ctrl-added-time.ctrl-added-time-active { color: #FF9E5C; background: rgba(255, 158, 92, 0.25); }
  .ctrl-next-half { color: #4CC9F0; }
  .ctrl-log-match { color: #C77DFF; }
  .ctrl-timer-toggle { color: #3BD16F; }
  .ctrl-timer-toggle.ctrl-timer-hidden { color: #777; }
  .ctrl-divider {
    width: 1px;
    align-self: stretch;
    background: rgba(255, 255, 255, 0.2);
    margin: 2px 2px;
  }
</style>
</head>
<body>
  <div id="scoreboard"></div>

  <script src="js/score-templates.js"></script>
  <script src="js/score-core.js"></script>
  <script>
    ScoreCore.start('#scoreboard');
  </script>
</body>
</html>
